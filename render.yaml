# Despliegue de la API en Render (plan gratis).
# Se crea en Render con New > Blueprint, eligiendo este repositorio y la rama develop.
# Los valores secretos (sync: false) los pide Render una sola vez, al crear el Blueprint.
services:
  - type: web
    name: conecta-plus-api-una
    runtime: node
    plan: free
    region: virginia
    rootDir: api
    # --include=dev: la CLI de Prisma (devDependency) hace falta para generar el cliente.
    buildCommand: npm install --include=dev && npm run db:generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      # En producción la API solo acepta devolver a conectaplus:// (ver api/README.md).
      - key: NODE_ENV
        value: production
      # Solo la usa `prisma generate` durante el build; la API se conecta con TURSO_*.
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://<tu-servicio>.onrender.com/api/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
